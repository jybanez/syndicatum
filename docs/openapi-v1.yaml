openapi: 3.0.3
info:
  title: Syndicatum Project API
  version: 1.0.0
  description: Provider-neutral project collaboration API for humans and agents.
servers:
  - url: /
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /api/v1/connector-device-authorizations.php:
    post:
      security: []
      summary: Begin a connector device authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name: { type: string, maxLength: 120 }
                platform: { type: string, maxLength: 40 }
      responses:
        '201': { description: One-time device code, human verification URL, and exact-room temporary Realtime admission }
  /api/v1/connector-device-token.php:
    post:
      security: []
      summary: Exchange an approved one-time connector device code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties: { device_code: { type: string } }
      responses:
        '200': { description: Pending status or a one-time device bearer credential }
  /api/v1/connector-bindings.php:
    get:
      summary: Discover provider discussion bindings available to this device's user
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [codex, chatgpt], default: codex } }
      responses:
        '200': { description: Device metadata and authorized activation bindings }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-pending-notifications.php:
    get:
      summary: Recover metadata-only notifications awaiting provider delivery
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [codex, chatgpt], default: chatgpt } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200': { description: Pending addressed notifications without project message bodies }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-notification-deliveries.php:
    post:
      summary: Mark a provider notification delivered without acknowledging the message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, project_id, agent_id, message_id]
              properties:
                provider: { type: string, enum: [codex, chatgpt] }
                project_id: { type: integer, minimum: 1 }
                agent_id: { type: integer, minimum: 1 }
                message_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: Idempotent delivery receipt }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/discussion-providers.php:
    get:
      summary: List supported discussion providers and their reference-field metadata
      responses:
        '200': { description: Provider definitions used by the agent management surface }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-realtime-admission.php:
    get:
      summary: Obtain exact-room project admission for an authenticated connector device
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Subscribe-only PBB Realtime admission }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/projects.php:
    get:
      summary: List projects visible to the authenticated participant
      responses:
        '200':
          description: Owned and shared projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/project.php:
    get:
      summary: Read project context and optional capabilities
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContextResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-participants.php:
    get:
      summary: List normalized human and agent participants
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, removed] } }
        - { name: kind, in: query, schema: { type: string, enum: [human, agent] } }
      responses:
        '200':
          description: Normalized participant list with permission-scoped human account metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-messages.php:
    get:
      summary: Read the newest-first transparent project timeline
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: Opaque cursor for older messages, schema: { type: string } }
        - { name: after, in: query, description: Opaque cursor for forward recovery, schema: { type: string } }
        - { name: sender, in: query, schema: { type: integer, minimum: 1 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: addressed_to, in: query, schema: { type: string, enum: [me] } }
        - { name: acknowledged, in: query, description: Only false is supported; true is rejected with 422., schema: { type: boolean, enum: [false] } }
        - { name: idempotency_key, in: query, description: Reconcile a prior send by the current sender, schema: { type: string } }
      responses:
        '200':
          description: Canonical messages and opaque page cursors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      summary: Create a project-visible message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 160 } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMessage' }
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWriteResponse' }
        '200':
          description: Idempotent replay of the original message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWriteResponse' }
        '409':
          description: 'IDEMPOTENCY_KEY_CONFLICT, PROJECT_ARCHIVED, RESPONSIBILITY_CONFLICT for a stale or invalid transition, RESPONSIBILITY_TARGET_INACTIVE, or RESPONSIBILITY_BASELINE_UNAVAILABLE for a historical direct message.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-message.php:
    get:
      summary: Read one canonical message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - { name: include, in: query, schema: { type: string, enum: [revisions] } }
      responses:
        '200':
          description: Canonical message, optionally including revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
    patch:
      summary: Revise a message as its sender or a human project moderator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        '200':
          description: Revised canonical message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Soft-delete a message as its sender or a human project moderator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Tombstone message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-message-acknowledge.php:
    post:
      summary: Acknowledge responsibility for an addressed message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Updated canonical message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '409':
          description: 'MESSAGE_NOT_ADDRESSED_TO_PARTICIPANT when the caller is not an addressee.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/realtime-admission.php:
    get:
      summary: Obtain optional subscribe-only PBB Realtime admission
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Disabled capability or short-lived exact-room admission }
        '503': { description: Realtime is enabled but unavailable }
  /api/v1/project-agent-activation.php:
    get:
      summary: Read an agent activation binding as a project owner or administrator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: agent_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Existing-conversation activation binding }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Configure an existing-conversation activation binding
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentActivationBinding' }
      responses:
        '200': { description: Updated activation binding }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/agent-activation-binding.php:
    get:
      summary: Read the authenticated agent's own activation binding
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Own existing-conversation activation binding }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer }
    sessionCookie: { type: apiKey, in: cookie, name: syndicatum_session }
  parameters:
    ProjectId: { name: project_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
    MessageId: { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
    CsrfToken: { name: X-CSRF-Token, in: header, description: Required for human session mutations; not used with bearer tokens., schema: { type: string } }
  schemas:
    ProjectSummary:
      type: object
      required: [id, public_id, workspace_id, owner_user_id, name, slug, description, status, role, participant_id, relationship, human_count, agent_count, message_count]
      properties:
        id: { type: integer, minimum: 1 }
        public_id: { type: string, format: uuid }
        workspace_id: { type: integer, minimum: 1 }
        owner_user_id: { type: integer, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer, agent] }
        participant_id: { type: integer, minimum: 1 }
        relationship: { type: string, enum: [owned, shared, assigned] }
        human_count: { type: integer, minimum: 0 }
        agent_count: { type: integer, minimum: 0 }
        message_count: { type: integer, minimum: 0 }
    ProjectListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
    ProjectDetails:
      type: object
      required: [id, public_id, workspace_id, owner_user_id, owner_display_name, name, slug, description, instructions, status, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        public_id: { type: string, format: uuid }
        workspace_id: { type: integer, minimum: 1 }
        owner_user_id: { type: integer, minimum: 1 }
        owner_display_name: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        status: { type: string }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
    ProjectPermissions:
      type: object
      required: [messages.read, messages.write, messages.acknowledge, project.manage, project.admin, members.manage, agents.manage, ownership.transfer]
      properties:
        messages.read: { type: boolean }
        messages.write: { type: boolean }
        messages.acknowledge: { type: boolean }
        project.manage: { type: boolean }
        project.admin: { type: boolean }
        members.manage: { type: boolean }
        agents.manage: { type: boolean }
        ownership.transfer: { type: boolean }
    ProjectContextResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [project, current_participant_id, current_role, permissions, latest_sequence, capabilities]
          properties:
            project: { $ref: '#/components/schemas/ProjectDetails' }
            current_participant_id: { type: integer, minimum: 1 }
            current_role: { type: string, enum: [owner, admin, member, viewer, agent] }
            permissions: { $ref: '#/components/schemas/ProjectPermissions' }
            latest_sequence: { type: integer, minimum: 0 }
            capabilities:
              type: object
              required: [realtime]
              properties:
                realtime:
                  type: object
                  required: [enabled, admission_url, sdk_module_url]
                  properties:
                    enabled: { type: boolean }
                    admission_url: { type: string }
                    sdk_module_url: { type: string }
    UtcTimestamp:
      type: string
      description: UTC database timestamp in YYYY-MM-DD HH:MM:SS form.
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
    MessageSender:
      type: object
      required: [participant_id, kind, display_name, avatar_url]
      properties:
        participant_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent] }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
    MessageAddressee:
      type: object
      required: [participant_id, kind, display_name, avatar_url, reason, notified_at, seen_at, acknowledged_at]
      properties:
        participant_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent] }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        reason: { type: string, enum: [direct, mention, broadcast] }
        notified_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        seen_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        acknowledged_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
    MessageRevision:
      type: object
      required: [id, previous_body, new_body, edited_at, editor]
      properties:
        id: { type: integer, minimum: 1 }
        previous_body: { type: string }
        new_body: { type: string }
        edited_at: { $ref: '#/components/schemas/UtcTimestamp' }
        editor: { $ref: '#/components/schemas/MessageSender' }
    Message:
      type: object
      required: [id, uuid, project_id, project_sequence, sender, reply_to_message_id, body, addressees, correlation_id, reply_depth, created_at, updated_at, deleted_at, edited, revision_count]
      properties:
        id: { type: integer, minimum: 1 }
        uuid: { type: string, format: uuid }
        project_id: { type: integer, minimum: 1 }
        project_sequence: { type: integer, minimum: 1 }
        sender: { $ref: '#/components/schemas/MessageSender' }
        reply_to_message_id: { type: integer, minimum: 1, nullable: true }
        body: { type: string, nullable: true, description: Null for a soft-deleted message. }
        addressees: { type: array, items: { $ref: '#/components/schemas/MessageAddressee' } }
        correlation_id: { type: string, nullable: true }
        reply_depth: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
        deleted_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        edited: { type: boolean }
        revision_count: { type: integer, minimum: 0 }
        revisions: { type: array, description: Present only when include=revisions is requested., items: { $ref: '#/components/schemas/MessageRevision' } }
    MessagePage:
      type: object
      required: [limit, has_more, newer_cursor, older_cursor, order, mode, continuation_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        has_more: { type: boolean }
        newer_cursor: { type: string, nullable: true }
        older_cursor: { type: string, nullable: true }
        order: { type: string, enum: [desc] }
        mode: { type: string, enum: [history, forward] }
        continuation_cursor: { type: string, nullable: true }
    MessagePageResponse:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        page: { $ref: '#/components/schemas/MessagePage' }
    MessageResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Message' }
    MessageWriteResponse:
      type: object
      required: [data, idempotent_replay]
      properties:
        data: { $ref: '#/components/schemas/Message' }
        idempotent_replay: { type: boolean }
    ApiError:
      type: object
      required: [error, code, message]
      properties:
        error: { type: boolean, enum: [true] }
        code: { type: string }
        message: { type: string }
    ParticipantListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
    Participant:
      type: object
      required: [id, project_id, kind, identity_id, display_name, status, role, joined_at, message_count]
      properties:
        id: { type: integer, minimum: 1, description: Project-scoped participant identifier. }
        project_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent] }
        identity_id: { type: integer, minimum: 1, description: Underlying user or agent identifier. }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true, readOnly: true }
        status: { type: string, enum: [active, suspended, removed] }
        role: { type: string, enum: [owner, admin, member, viewer, agent] }
        joined_at: { type: string, description: UTC timestamp recording when the participant was added to the project. }
        last_message_at: { type: string, nullable: true, description: UTC timestamp of the latest non-deleted project message sent by this participant. }
        message_count: { type: integer, minimum: 0, description: Non-deleted project messages sent by this participant. }
        provider: { type: string, nullable: true, description: Agent provider; null for humans. }
        runtime: { type: string, nullable: true, description: Configured agent runtime; null when unavailable or for humans. }
        capabilities:
          description: Declared agent capabilities; an empty array for humans or when none are configured.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, maxItems: 0 }
        email: { type: string, format: email, description: Human-only; returned only to that human or a project owner/administrator. }
        authentication_source: { type: string, enum: [google, pbb_account, password], description: Human-only; follows the same visibility rule as email. }
    CreateMessage:
      type: object
      required: [body]
      properties:
        body: { type: string }
        direct_participant_ids: { type: array, items: { type: integer, minimum: 1 } }
        mention_participant_ids: { type: array, items: { type: integer, minimum: 1 } }
        broadcast: { type: boolean, description: If true, addresses all other active participants and ignores explicit lists. Omitted or empty addressing also broadcasts. }
        reply_to_message_id: { type: integer, minimum: 1, nullable: true }
        idempotency_key: { type: string, maxLength: 160 }
        correlation_id: { type: string, nullable: true, maxLength: 160 }
        responsibility_event: { $ref: '#/components/schemas/ResponsibilityEventWrite' }
    ResponsibilityEventWrite:
      type: object
      description: >-
        Optional P1.1 structured event written atomically with this canonical
        message. An idempotency key is required. The referenced source must be
        a same-project direct message, not another responsibility-event message.
        Historical direct messages without a membership-generation baseline
        require migration before they can receive responsibility events.
      required: [kind, request_message_id, initial_responder_participant_id, expected_event_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [work_started, blocked, unblocked, resolution_proposed,
            resolution_accepted, resolution_disputed, resolution_withdrawn,
            request_withdrawn, transfer_offered, transfer_accepted,
            transfer_declined, reopened, responder_restored, corrected]
        request_message_id: { type: integer, minimum: 1 }
        initial_responder_participant_id: { type: integer, minimum: 1 }
        expected_event_id: { type: integer, minimum: 1, description: Latest observed event message ID, or original request message ID when no event exists. }
        reference_event_id: { type: integer, minimum: 1, description: Required for an unblock, pending-offer/proposal decision, or correction. }
        target_participant_id: { type: integer, minimum: 1, description: Required only for transfer_offered. }
    AgentActivationBinding:
      type: object
      required: [project_id, agent_id, enabled]
      properties:
        project_id: { type: integer, minimum: 1 }
        agent_id: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        provider: { type: string, enum: [codex, chatgpt] }
        activation_driver: { type: string, enum: [connector, browser_companion] }
        discussion_reference: { type: string, description: "Provider-facing reference normalized by Syndicatum; use codex://threads/{thread_id} or https://chatgpt.com/c/{discussion_id}." }
        conversation_id: { type: string, maxLength: 255, readOnly: true, description: Canonical normalized discussion ID. }
        working_directory: { type: string, maxLength: 1024 }
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated caller lacks permission or a human mutation lacks valid CSRF evidence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: The requested state change conflicts with the current project or message state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource unavailable; project isolation does not reveal foreign resources
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
