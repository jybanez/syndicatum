openapi: 3.0.3
info:
  title: Syndicatum Project API
  version: 1.0.0
  description: Provider-neutral project collaboration API for humans and agents.
servers:
  - url: /
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /api/v1/connector-device-authorizations.php:
    post:
      security: []
      summary: Begin a connector device authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name: { type: string, maxLength: 120 }
                platform: { type: string, maxLength: 40 }
      responses:
        '201': { description: One-time device code, human verification URL, and exact-room temporary Realtime admission }
  /api/v1/connector-device-token.php:
    post:
      security: []
      summary: Exchange an approved one-time connector device code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties: { device_code: { type: string } }
      responses:
        '200': { description: Pending status or a one-time device bearer credential }
  /api/v1/connector-bindings.php:
    get:
      summary: Discover provider discussion bindings available to this device's user
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [codex, chatgpt], default: codex } }
      responses:
        '200': { description: Device metadata and authorized activation bindings }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-pending-notifications.php:
    get:
      summary: Recover metadata-only notifications awaiting provider delivery
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [codex, chatgpt], default: chatgpt } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200': { description: Pending addressed notifications without project message bodies }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-notification-deliveries.php:
    post:
      summary: Mark a provider notification delivered without acknowledging the message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, project_id, agent_id, message_id]
              properties:
                provider: { type: string, enum: [codex, chatgpt] }
                project_id: { type: integer, minimum: 1 }
                agent_id: { type: integer, minimum: 1 }
                message_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: Idempotent delivery receipt }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-agent-replies.php:
    post:
      summary: Submit one captured Gemini response through its authorized discussion binding
      description: Validates device ownership, binding, project membership, target agent, and the source addressee; posts one idempotent agent reply and acknowledges the source only after the reply succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, project_id, agent_id, message_id, response]
              properties:
                provider: { type: string, enum: [gemini] }
                project_id: { type: integer, minimum: 1 }
                agent_id: { type: integer, minimum: 1 }
                message_id: { type: integer, minimum: 1 }
                response: { type: string, minLength: 1 }
      responses:
        '200': { description: Idempotent captured-response submission result }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A different response was already posted for this notification }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/discussion-providers.php:
    get:
      summary: List supported discussion providers and their reference-field metadata
      responses:
        '200': { description: Provider definitions used by the agent management surface }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/connector-realtime-admission.php:
    get:
      summary: Obtain exact-room project admission for an authenticated connector device
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Subscribe-only Realtime admission }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/projects.php:
    get:
      summary: List projects visible to the authenticated participant
      responses:
        '200':
          description: Owned and shared projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/project.php:
    get:
      summary: Read project context and optional capabilities
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContextResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-read-state.php:
    post:
      summary: Advance the authenticated participant's project timeline read position
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last_read_sequence]
              properties:
                last_read_sequence: { type: integer, minimum: 0 }
      responses:
        '200': { description: Current read position and remaining unread-message count }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-bootstrap.php:
    get:
      summary: Read project context, effective instructions, assignment, permissions, work summary, and timeline attention state
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Project bootstrap context for the authenticated participant }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-files.php:
    get:
      summary: List folders and files in one authorized project folder
      description: Returns provider-neutral metadata and each file's permanent canonical public URL. Filesystem paths and storage keys are never returned.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: folder_id, in: query, description: Folder UUID; omit or use root for the project root., schema: { type: string } }
        - { name: page, in: query, description: One-based file page., schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: per_page, in: query, description: Bounded files per page., schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, description: Case-insensitive filename, MIME type, or uploader search., schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, type, size, uploader, created, updated, state], default: name } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200': { description: Current folder, root-to-current breadcrumbs, folder tree, bounded file page with uploader and availability metadata, pagination state, capabilities, and project quota summary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      summary: Mutate project folders or files through the canonical audited storage service
      description: JSON operations create folders, rename, move, or delete files. Multipart upload_chunk requests provide resumable 1 MiB upload or explicitly confirmed same-name replacement. Human sessions require CSRF; agents use their project-scoped bearer identity. Every mutation requires a stable Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 160 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string, enum: [create_folder, rename_file, move_file, delete_file] }
                name: { type: string, maxLength: 255 }
                parent_folder_id: { type: string }
                file_id: { type: string, format: uuid }
                destination_folder_id: { type: string }
                version: { type: integer, minimum: 1 }
          multipart/form-data:
            schema:
              type: object
              required: [operation, upload_id, chunk_index, chunk_count, total_size, target_operation, original_name, file]
              properties:
                operation: { type: string, enum: [upload_chunk] }
                upload_id: { type: string, format: uuid }
                chunk_index: { type: integer, minimum: 0 }
                chunk_count: { type: integer, minimum: 1 }
                total_size: { type: integer, minimum: 1 }
                target_operation: { type: string, enum: [upload, replace_file] }
                original_name: { type: string, maxLength: 255 }
                folder_id: { type: string }
                file_id: { type: string, format: uuid, description: Required only for explicitly confirmed replacement. }
                version: { type: integer, minimum: 1, description: Required only for explicitly confirmed replacement. }
                file: { type: string, format: binary, description: One upload chunk; clients should use 1 MiB chunks. }
      responses:
        '200': { description: Replayed or completed mutation result }
        '201': { description: Created folder or newly uploaded file }
        '202': { description: Upload chunk accepted; additional chunks remain }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Name, idempotency, upload-session, or optimistic-version conflict }
        '422': { $ref: '#/components/responses/Invalid' }
  /files/{file_id}:
    get:
      security: []
      summary: Read a file from its permanent unguessable public URL
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Range, in: header, schema: { type: string }, description: Optional single byte range. }
      responses:
        '200': { description: Complete file content with verified Content-Type and safe Content-Disposition }
        '206': { description: Requested byte range }
        '404': { description: File is unavailable }
        '416': { description: Requested range is not satisfiable }
    head:
      security: []
      summary: Read public file metadata headers without a response body
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Public file response headers }
        '404': { description: File is unavailable }
  /api/v1/project-tasks.php:
    get:
      summary: List shared project tasks
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, description: One or more comma-separated task statuses., schema: { type: string } }
        - { name: assignee, in: query, description: Participant ID or me., schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: Shared project task collection }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      summary: Create a project task under the authenticated participant's immutable giver identity
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { description: Created task with activity history }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-task.php:
    get:
      summary: Read one task and its immutable activity history
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Project task with activity history }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    patch:
      summary: Apply a version-checked task update or lifecycle transition
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200': { description: Updated task with activity history }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Task version conflict or invalid lifecycle transition }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-change-proposals.php:
    post:
      summary: Submit a human-reviewed project or project-agent improvement proposal
      description: Active project agents may submit proposals. The proposal remains pending until a human owner or administrator reviews it; this operation never applies the change.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectChangeProposalCreate' }
      responses:
        '201': { description: Durable pending proposal }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-plan.php:
    get:
      summary: Read project milestones, deliverables, and task-backed progress
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Project plan visible to every active project participant }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-milestones.php:
    post:
      summary: Create a project milestone as an owner or administrator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '201': { description: Created milestone }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-milestone.php:
    patch:
      summary: Apply a version-checked milestone update
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated milestone }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Milestone version conflict }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Delete an empty milestone with an exact version
      description: Requires an owner or administrator. A milestone containing any deliverable must be emptied first. Successful deletion is audited and broadcast.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated project plan after deletion }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict or milestone still contains deliverables }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-deliverables.php:
    post:
      summary: Create a standalone or milestone-bound deliverable
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '201': { description: Created deliverable }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-deliverable.php:
    patch:
      summary: Apply a version-checked deliverable update
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated deliverable with task-backed progress }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Deliverable version conflict }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Delete an unlinked deliverable with an exact version
      description: Requires an owner or administrator. A deliverable linked from any task must be unlinked first. Successful deletion is audited and broadcast.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated project plan after deletion }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict or deliverable still has linked tasks }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-milestone-progress.php:
    patch:
      summary: Apply a permissioned, version-checked milestone status update
      description: Requires owner/admin authority or the agent plan:progress scope. Accepts only version, status, and note; agents must provide a note.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated milestone }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Version conflict or incomplete deliverables }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-deliverable-progress.php:
    patch:
      summary: Apply a permissioned, version-checked deliverable status update
      description: Requires owner/admin authority or the agent plan:progress scope. Accepts only version, status, and note; agents must provide a note.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Updated deliverable }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Version conflict or incomplete linked tasks }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-task-deliverable.php:
    patch:
      summary: Link or unlink a task from an approved-plan deliverable
      description: Requires owner/admin authority or the agent plan:progress scope. Accepts only version, deliverable_id, and an evidence note. It cannot change task ownership or lifecycle, and rejects an incomplete task link that would invalidate a ready deliverable.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDeliverableLinkUpdate' }
      responses:
        '200': { description: Updated task with its current deliverable link and immutable activity history }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Task version conflict or incompatible ready-deliverable link }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-plan-order.php:
    patch:
      summary: Atomically reorder milestones or move and reorder deliverables
      description: Requires an owner or administrator. Milestone changes submit the complete milestone order and exact versions. Deliverable changes submit source and destination membership, complete affected orders, and exact affected versions. A conflict never applies a partial order.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Authoritative project plan after the atomic reorder }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Project-plan order or optimistic-version conflict }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-summary.php:
    get:
      summary: Read owner-only headline project status aggregates
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Task, active-team, and message-sequence aggregates }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-task-progress.php:
    get:
      summary: Read owner-only task counts by status and completion percentage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Aggregate task progress without task records }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-plan.php:
    get:
      summary: Read bounded owner-only milestone and deliverable readiness
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Aggregate counts plus at most three milestone summaries; never the full hierarchy }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-activity.php:
    get:
      summary: Read owner-only bounded project outcome activity
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: days, in: query, schema: { type: integer, enum: [7, 14, 30], default: 14 } }
      responses:
        '200': { description: UTC date buckets and totals for opened, completed, blocked, sent-for-review, and reassigned tasks, plus secondary message volume }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-attention.php:
    get:
      summary: Read an owner-only bounded page of tasks needing attention
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
        - { name: before, in: query, description: Exclusive task-ID cursor., schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Cursor page of blocked, in-review, or overdue tasks }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-team.php:
    get:
      summary: Read owner-only participant state aggregates
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Participant counts by identity kind and membership state }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-status-integrations.php:
    get:
      summary: Read owner-only integration readiness aggregates
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Connection state and active-credential readiness aggregates }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-participants.php:
    get:
      summary: List normalized human, agent, and external integration participants
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, removed] } }
        - { name: kind, in: query, schema: { type: string, enum: [human, agent, integration] } }
      responses:
        '200':
          description: Normalized participant list with permission-scoped human account metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-integrations.php:
    get:
      summary: List external integration identities as a project owner or administrator
      description: Integrations are visible participants but cannot receive messages, responsibility, or tasks. Removed records are retained for audit and history. Credential state is reported without returning the callback credential.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: integration_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: include_removed, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: One connection or the project connection collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      summary: Create an external integration identity and its project participant
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationConnection' }
      responses:
        '201':
          description: Integration identity created with the fixed events.write capability; issue its callback URL separately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    patch:
      summary: Update or enable/disable an external integration identity
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntegrationConnection' }
      responses:
        '200':
          description: Updated integration identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Retire an external integration identity while preserving history
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, integration_id]
              properties:
                project_id: { type: integer, minimum: 1 }
                integration_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Retired integration identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-integration-credentials.php:
    post:
      summary: Issue or explicitly rotate an integration capability URL
      description: The callback URL contains a high-entropy credential, is returned only by this mutation, and must be copied before it is dismissed. Rotation immediately revokes every prior active credential without replacing the integration identity.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, integration_id, action]
              properties:
                project_id: { type: integer, minimum: 1 }
                integration_id: { type: integer, minimum: 1 }
                action: { type: string, enum: [issue, rotate] }
      responses:
        '201':
          description: One-time capability URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCredentialResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Revoke the active integration capability URL
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, integration_id]
              properties:
                project_id: { type: integer, minimum: 1 }
                integration_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: Credential revocation result }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/integration-events/{integration_public_id}/{credential}:
    post:
      security: []
      summary: Ingest an authenticated external event through a universal capability URL
      description: The URL credential determines the project and integration identity. Requests must use HTTPS and application/json. The decoded JSON payload is retained in the immutable system event and is readable by project members; Syndicatum also stores its digest, bounded source metadata, and audit evidence. Exact replays reconcile to the original receipt.
      parameters:
        - name: integration_public_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: credential
          in: path
          required: true
          schema: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        - name: Idempotency-Key
          in: header
          description: Optional stable delivery key. When absent, the payload digest is the idempotency identity.
          schema: { type: string, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationEventInput' }
      responses:
        '202':
          description: Event accepted and written to the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationEventResponse' }
        '200':
          description: Exact idempotent replay reconciled to the original receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationEventResponse' }
        '404': { description: Capability URL is invalid, inactive, disabled, removed, revoked, or unknown. }
        '409': { description: The idempotency key was previously used with a different payload. }
        '413': { description: Payload exceeds the fixed 64 KiB global cap. }
        '415': { description: Content-Type is not application/json. }
        '422': { description: Payload, event type, severity, or idempotency metadata was rejected. }
        '429': { description: Fixed per-integration rate cap exceeded. }
  /api/v1/project-messages.php:
    get:
      summary: Read the newest-first transparent project timeline
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: Opaque cursor for older messages, schema: { type: string } }
        - { name: after, in: query, description: Opaque cursor for forward recovery, schema: { type: string } }
        - { name: sender, in: query, description: One or more sender participant IDs., style: form, explode: false, schema: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } } }
        - { name: message_kind, in: query, description: Limit results to participant-authored messages or immutable system events., schema: { type: string, enum: [participant, system] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: addressed_to, in: query, schema: { type: string, enum: [me] } }
        - { name: acknowledged, in: query, description: Only false is supported; true is rejected with 422., schema: { type: boolean, enum: [false] } }
        - { name: idempotency_key, in: query, description: Reconcile a prior send by the current sender, schema: { type: string } }
      responses:
        '200':
          description: Canonical messages and opaque page cursors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      summary: Create a project-visible message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 160 } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMessage' }
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWriteResponse' }
        '200':
          description: Idempotent replay of the original message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWriteResponse' }
        '409':
          description: 'IDEMPOTENCY_KEY_CONFLICT, PROJECT_ARCHIVED, RESPONSIBILITY_CONFLICT for a stale or invalid transition, RESPONSIBILITY_TARGET_INACTIVE, or RESPONSIBILITY_BASELINE_UNAVAILABLE for a historical direct message.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-responsibility-inbox.php:
    get:
      summary: Derive responsibility items from canonical direct messages and events
      description: Read-only; no mutable inbox status. The project-bound keyset cursor prevents duplicate source rows when newer messages prepend. Clients may pass changed_by_message_id after a Realtime message event to resolve and refresh only the affected original request. A normal page scans at most limit direct-request addressee rows, so a filtered page may contain fewer items than limit while has_more remains true. Historical rows without a verified membership-generation baseline are returned as unknown.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: before, in: query, description: Opaque project-bound cursor for older direct-request addressee rows., schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [all, mine, addressed_to_me, unacknowledged, waiting_on_others, blocked, transfer_pending, resolution_pending, disputed, orphaned, resolved, unknown], default: all } }
        - { name: changed_by_message_id, in: query, description: Resolve this newly created request or responsibility-event message to its original request and return only that request's projection for the selected view., schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Derived responsibility items and an opaque candidate-page cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsibilityInboxPageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-message.php:
    get:
      summary: Read one canonical message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - { name: include, in: query, schema: { type: string, enum: [revisions] } }
      responses:
        '200':
          description: Canonical message, optionally including revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
    patch:
      summary: Revise a message as its sender or a human project moderator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        '200':
          description: Revised canonical message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Soft-delete a message as its sender or a human project moderator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Tombstone message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/project-message-acknowledge.php:
    post:
      summary: Acknowledge responsibility for an addressed message
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Updated canonical message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '409':
          description: 'MESSAGE_NOT_ADDRESSED_TO_PARTICIPANT when the caller is not an addressee.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/realtime-admission.php:
    get:
      summary: Obtain optional subscribe-only Realtime admission
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Disabled capability or short-lived exact-room admission }
        '503': { description: Realtime is enabled but unavailable }
  /api/v1/project-agent-activation.php:
    get:
      summary: Read an agent activation binding as a project owner or administrator
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: agent_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Existing-conversation activation binding }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Configure an existing-conversation activation binding
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentActivationBinding' }
      responses:
        '200': { description: Updated activation binding }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/agent-activation-binding.php:
    get:
      summary: Read the authenticated agent's own activation binding
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Own existing-conversation activation binding }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer }
    sessionCookie: { type: apiKey, in: cookie, name: syndicatum_session }
  parameters:
    ProjectId: { name: project_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
    MessageId: { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
    CsrfToken: { name: X-CSRF-Token, in: header, description: Required for human session mutations; not used with bearer tokens., schema: { type: string } }
  schemas:
    ProjectSummary:
      type: object
      required: [id, public_id, workspace_id, owner_user_id, name, slug, description, google_drive_url, status, role, participant_id, relationship, human_count, agent_count, integration_count, message_count, unread_message_count]
      properties:
        id: { type: integer, minimum: 1 }
        public_id: { type: string, format: uuid }
        workspace_id: { type: integer, minimum: 1 }
        owner_user_id: { type: integer, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        google_drive_url: { type: string, format: uri, nullable: true, description: Optional canonical Google Drive folder used as shared project storage. }
        status: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer, agent] }
        participant_id: { type: integer, minimum: 1 }
        relationship: { type: string, enum: [owned, shared, assigned] }
        human_count: { type: integer, minimum: 0 }
        agent_count: { type: integer, minimum: 0 }
        integration_count: { type: integer, minimum: 0 }
        message_count: { type: integer, minimum: 0 }
        unread_message_count: { type: integer, minimum: 0, description: Non-deleted messages from other participants since this participant last read the full project timeline. }
    ProjectListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
    ProjectDetails:
      type: object
      required: [id, public_id, workspace_id, owner_user_id, owner_display_name, name, slug, description, instructions, google_drive_url, status, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        public_id: { type: string, format: uuid }
        workspace_id: { type: integer, minimum: 1 }
        owner_user_id: { type: integer, minimum: 1 }
        owner_display_name: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        google_drive_url: { type: string, format: uri, nullable: true, description: Optional canonical Google Drive folder used as shared project storage. }
        status: { type: string }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
    ProjectPermissions:
      type: object
      required: [messages.read, messages.write, messages.acknowledge, project.manage, project.admin, members.manage, agents.manage, ownership.transfer]
      properties:
        messages.read: { type: boolean }
        messages.write: { type: boolean }
        messages.acknowledge: { type: boolean }
        project.manage: { type: boolean }
        project.admin: { type: boolean }
        members.manage: { type: boolean }
        agents.manage: { type: boolean }
        ownership.transfer: { type: boolean }
    ProjectContextResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [project, current_participant_id, current_role, governance, effective_instructions, permissions, latest_sequence, capabilities]
          properties:
            project: { $ref: '#/components/schemas/ProjectDetails' }
            current_participant_id: { type: integer, minimum: 1 }
            current_role: { type: string, enum: [owner, admin, member, viewer, agent] }
            governance:
              type: object
              description: Immutable, versioned operating rules applied to every project.
              required: [version, instructions, immutable]
              properties:
                version: { type: integer, minimum: 1 }
                instructions: { type: string }
                immutable: { type: boolean, enum: [true] }
            effective_instructions:
              type: string
              description: Governance baseline followed by project-specific operating instructions and shared-storage guidance when configured.
            permissions: { $ref: '#/components/schemas/ProjectPermissions' }
            latest_sequence: { type: integer, minimum: 0 }
            capabilities:
              type: object
              required: [realtime]
              properties:
                realtime:
                  type: object
                  required: [enabled, admission_url, sdk_module_url]
                  properties:
                    enabled: { type: boolean }
                    admission_url: { type: string }
                    sdk_module_url: { type: string }
    UtcTimestamp:
      type: string
      description: UTC database timestamp in YYYY-MM-DD HH:MM:SS form.
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
    MessageSender:
      type: object
      required: [participant_id, kind, display_name, avatar_url]
      properties:
        participant_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent, integration] }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
    MessageAddressee:
      type: object
      required: [participant_id, kind, display_name, avatar_url, reason, notified_at, seen_at, acknowledged_at]
      properties:
        participant_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent] }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        reason: { type: string, enum: [direct, mention, broadcast] }
        notified_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        seen_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        acknowledged_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
    MessageRevision:
      type: object
      required: [id, previous_body, new_body, edited_at, editor]
      properties:
        id: { type: integer, minimum: 1 }
        previous_body: { type: string }
        new_body: { type: string }
        edited_at: { $ref: '#/components/schemas/UtcTimestamp' }
        editor: { $ref: '#/components/schemas/MessageSender' }
    Message:
      type: object
      required: [id, uuid, project_id, project_sequence, message_kind, severity, system_event, sender, reply_to_message_id, body, addressees, attachments, correlation_id, reply_depth, action_requested, action_request_type, created_at, updated_at, deleted_at, edited, revision_count]
      properties:
        id: { type: integer, minimum: 1 }
        uuid: { type: string, format: uuid }
        project_id: { type: integer, minimum: 1 }
        project_sequence: { type: integer, minimum: 1 }
        message_kind: { type: string, enum: [participant, system] }
        severity: { type: string, enum: [neutral, info, success, warning, error, critical] }
        system_event: { type: object, nullable: true, additionalProperties: true, description: Structured server event context; null for participant messages. }
        sender: { $ref: '#/components/schemas/MessageSender' }
        reply_to_message_id: { type: integer, minimum: 1, nullable: true }
        body: { type: string, nullable: true, description: Null for a soft-deleted message. }
        addressees: { type: array, items: { $ref: '#/components/schemas/MessageAddressee' } }
        attachments: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/MessageAttachment' }, description: Ordered canonical project-file references. Empty for soft-deleted messages. }
        correlation_id: { type: string, nullable: true }
        reply_depth: { type: integer, minimum: 0 }
        action_requested: { type: boolean, description: True only when this direct message explicitly creates Responsibility Inbox work. }
        action_request_type: { type: string, nullable: true, enum: [work, approval, review, null], description: Classified response workflow for an action request; null for informational and system messages. }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
        deleted_at: { allOf: [{ $ref: '#/components/schemas/UtcTimestamp' }], nullable: true }
        edited: { type: boolean }
        revision_count: { type: integer, minimum: 0 }
        revisions: { type: array, description: Present only when include=revisions is requested., items: { $ref: '#/components/schemas/MessageRevision' } }
    MessageAttachment:
      type: object
      required: [id, name, original_name, url, mime_type, size_bytes, sha256, state, available, version, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: Permanent canonical project-file identifier. }
        name: { type: string }
        original_name: { type: string }
        url: { type: string, nullable: true, description: Permanent canonical file URL; null when the file is unavailable or deleted. }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state: { type: string, enum: [pending, available, unavailable, deleted, integrity_failed] }
        available: { type: boolean }
        version: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 0, maximum: 19 }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
    MessagePage:
      type: object
      required: [limit, has_more, newer_cursor, older_cursor, order, mode, continuation_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        has_more: { type: boolean }
        newer_cursor: { type: string, nullable: true }
        older_cursor: { type: string, nullable: true }
        order: { type: string, enum: [desc] }
        mode: { type: string, enum: [history, forward] }
        continuation_cursor: { type: string, nullable: true }
    MessagePageResponse:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        page: { $ref: '#/components/schemas/MessagePage' }
    ResponsibilityInboxItem:
      type: object
      required: [project_id, request_message_id, request_sequence, request_created_at, request_type, requester_participant_id, initial_responder_participant_id, current_responder_participant_id, last_responder_participant_id, state, blocked, block_event_message_id, work_started, outcome, pending_event_message_id, pending_target_participant_id, pending_proposer_participant_id, acknowledged, latest_evidence_message_id, latest_evidence_sequence, projection_error, canonical_message_api_href]
      properties:
        project_id: { type: integer, minimum: 1 }
        request_message_id: { type: integer, minimum: 1 }
        request_sequence: { type: integer, minimum: 1 }
        request_created_at: { type: string }
        request_type: { type: string, enum: [work, approval, review] }
        requester_participant_id: { type: integer, minimum: 1 }
        initial_responder_participant_id: { type: integer, minimum: 1 }
        current_responder_participant_id: { type: integer, minimum: 1, nullable: true }
        last_responder_participant_id: { type: integer, minimum: 1, nullable: true, description: Last explicitly assigned responder even when currently orphaned; null for unknown baselines. }
        state: { type: string, enum: [open, resolution_pending, transfer_pending, disputed, orphaned, resolved, unknown] }
        blocked: { type: boolean, nullable: true }
        block_event_message_id: { type: integer, minimum: 1, nullable: true, description: Exact active block event to reference when unblocking. }
        work_started: { type: boolean, nullable: true }
        outcome: { type: string, nullable: true, enum: [accepted, approved, denied, revision_requested, withdrawn, null], description: Distinguishes the terminal decision from withdrawn requests. }
        pending_event_message_id: { type: integer, minimum: 1, nullable: true, description: Exact pending transfer offer or resolution proposal event to reference for a decision. }
        pending_target_participant_id: { type: integer, minimum: 1, nullable: true, description: Proposed transfer target when a transfer is pending. }
        pending_proposer_participant_id: { type: integer, minimum: 1, nullable: true, description: Resolution proposer when a resolution is pending. }
        acknowledged: { type: boolean }
        latest_evidence_message_id: { type: integer, minimum: 1, nullable: true }
        latest_evidence_sequence: { type: integer, minimum: 1, nullable: true }
        projection_error: { type: string, nullable: true, enum: [RESPONSIBILITY_BASELINE_UNAVAILABLE, RESPONSIBILITY_PROJECTION_FAILED, null] }
        canonical_message_api_href: { type: string }
    ResponsibilityInboxPageResponse:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ResponsibilityInboxItem' } }
        page:
          type: object
          required: [limit, scanned, has_more, unacknowledged_count, changed_request_message_id, older_cursor]
          properties:
            limit: { type: integer, minimum: 1, maximum: 50 }
            scanned: { type: integer, minimum: 0, maximum: 50 }
            has_more: { type: boolean }
            unacknowledged_count: { type: integer, minimum: 0, description: Current participant's total unacknowledged direct action requests in this project. }
            changed_request_message_id: { type: integer, minimum: 1, nullable: true, description: Original request resolved from changed_by_message_id; null for normal pagination. }
            older_cursor: { type: string, nullable: true }
    MessageResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Message' }
    MessageWriteResponse:
      type: object
      required: [data, idempotent_replay]
      properties:
        data: { $ref: '#/components/schemas/Message' }
        idempotent_replay: { type: boolean }
    ApiError:
      type: object
      required: [error, code, message]
      properties:
        error: { type: boolean, enum: [true] }
        code: { type: string }
        message: { type: string }
    ParticipantListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
    Participant:
      type: object
      required: [id, project_id, kind, identity_id, display_name, status, role, joined_at, message_count]
      properties:
        id: { type: integer, minimum: 1, description: Project-scoped participant identifier. }
        project_id: { type: integer, minimum: 1 }
        kind: { type: string, enum: [human, agent, integration] }
        identity_id: { type: integer, minimum: 1, description: Underlying user, agent, or integration-connection identifier. }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true, readOnly: true }
        status: { type: string, enum: [active, suspended, removed] }
        role: { type: string, enum: [owner, admin, member, viewer, agent, integration] }
        joined_at: { type: string, description: UTC timestamp recording when the participant was added to the project. }
        last_message_at: { type: string, nullable: true, description: UTC timestamp of the latest non-deleted project message sent by this participant. }
        message_count: { type: integer, minimum: 0, description: Non-deleted project messages sent by this participant. }
        provider: { type: string, nullable: true, description: Agent or integration provider; null for humans. }
        runtime: { type: string, nullable: true, description: Configured agent runtime; null when unavailable or for humans. }
        capabilities:
          description: Declared agent or integration capabilities; an empty array for humans or when none are configured.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, maxItems: 0 }
        description: { type: string, nullable: true, description: Integration description; null for other participant kinds. }
        external_reference: { type: string, nullable: true, description: Optional external-system identity reference; null for other participant kinds. }
        credential_configured: { type: boolean, readOnly: true, description: Integration-only indicator that an active callback credential exists; always false for other participant kinds. }
        credential_last_used_at: { type: string, nullable: true, readOnly: true, description: Integration-only UTC timestamp of the most recently accepted callback; never exposes credential material. }
        email: { type: string, format: email, description: Human-only; returned only to that human or a project owner/administrator. }
        authentication_source: { type: string, enum: [google, pbb_account, password], description: Human-only; follows the same visibility rule as email. pbb_account is the retained identifier for the optional external identity provider rather than product branding. }
    IntegrationConnectionResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - { $ref: '#/components/schemas/IntegrationConnection' }
            - type: array
              items: { $ref: '#/components/schemas/IntegrationConnection' }
    IntegrationConnection:
      type: object
      required: [id, public_id, project_id, participant_id, kind, provider, display_name, capabilities, notification_participant_ids, status, participant_status, status_generation, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        public_id: { type: string, format: uuid, readOnly: true }
        project_id: { type: integer, minimum: 1 }
        participant_id: { type: integer, minimum: 1, readOnly: true }
        kind: { type: string, enum: [integration], readOnly: true }
        provider: { type: string, pattern: '^[a-z][a-z0-9_-]{1,79}$' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
        external_reference: { type: string, nullable: true, maxLength: 255 }
        capabilities:
          type: array
          readOnly: true
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [events.write] }
        status: { type: string, enum: [active, disabled, removed] }
        participant_status: { type: string, enum: [active, suspended, removed], readOnly: true }
        status_generation: { type: integer, minimum: 0, readOnly: true, description: Monotonic participant lifecycle generation. }
        credential_configured: { type: boolean, readOnly: true }
        credential_last_used_at: { type: string, nullable: true, readOnly: true }
        notification_participant_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
          description: Active human and agent participants who receive each incoming event as an FYI.
        created_at: { type: string }
        updated_at: { type: string }
    CreateIntegrationConnection:
      type: object
      required: [project_id, display_name]
      properties:
        project_id: { type: integer, minimum: 1 }
        provider: { type: string, pattern: '^[a-z][a-z0-9_-]{1,79}$', default: generic }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        external_reference: { type: string, maxLength: 255 }
        notification_participant_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
          description: FYI recipients; defaults to the active project owner when omitted for backward compatibility.
    UpdateIntegrationConnection:
      allOf:
        - type: object
          required: [project_id, integration_id]
          properties:
            project_id: { type: integer, minimum: 1 }
            integration_id: { type: integer, minimum: 1 }
        - type: object
          properties:
            display_name: { type: string, minLength: 1, maxLength: 120 }
            description: { type: string, nullable: true, maxLength: 500 }
            external_reference: { type: string, nullable: true, maxLength: 255 }
            status: { type: string, enum: [active, disabled] }
            notification_participant_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 1 }
    IntegrationCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [integration_id, credential_id, credential_prefix, callback_url, shown_once, created_at]
          properties:
            integration_id: { type: integer, minimum: 1 }
            credential_id: { type: integer, minimum: 1 }
            credential_prefix: { type: string, readOnly: true, description: Non-secret diagnostic prefix. }
            callback_url: { type: string, format: uri, writeOnly: true, description: Secret-bearing URL shown only in this response. }
            shown_once: { type: boolean, enum: [true] }
            created_at: { type: string }
    IntegrationEventInput:
      type: object
      description: Arbitrary provider JSON is accepted when it omits the optional normalized fields. Only the normalized fields below influence the timeline summary; the complete decoded JSON object is retained in the immutable system event for project members to inspect.
      properties:
        event_type: { type: string, enum: [event, alert, status, build, deployment, incident, security, monitoring, source_control], default: event }
        severity: { type: string, enum: [neutral, info, success, warning, error, critical], default: info }
        title: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 4000 }
        source:
          type: object
          properties:
            event_id: { type: string, maxLength: 255 }
            resource_type: { type: string, maxLength: 255 }
            resource_id: { type: string, maxLength: 255 }
            name: { type: string, maxLength: 255 }
            url: { type: string, maxLength: 1000 }
      additionalProperties: true
    IntegrationEventResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [receipt_id, message_id, duplicate, created_at]
          properties:
            receipt_id: { type: string, format: uuid }
            message_id: { type: integer, minimum: 1 }
            duplicate: { type: boolean }
            created_at: { type: string }
    CreateMessage:
      type: object
      required: [body]
      properties:
        body: { type: string }
        direct_participant_ids: { type: array, items: { type: integer, minimum: 1 } }
        mention_participant_ids: { type: array, items: { type: integer, minimum: 1 } }
        broadcast: { type: boolean, description: If true, addresses all other active participants and ignores explicit lists. Omitted or empty addressing also broadcasts. }
        action_requested: { type: boolean, default: false, description: If true, creates Responsibility Inbox work for each direct recipient. Invalid for broadcasts. Direct addressing alone is informational. }
        action_request_type: { type: string, enum: [work, approval, review], description: Required conceptually when action_requested is true; omitted requests default to work for backward compatibility and it is invalid otherwise. }
        severity: { type: string, enum: [neutral, info, success, warning, error, critical], default: neutral, description: Canonical importance independent from addressing and action-request state. }
        reply_to_message_id: { type: integer, minimum: 1, nullable: true }
        attachment_file_ids: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid }, description: Ordered canonical file IDs from this project. Every file must still be available when the message transaction commits. }
        idempotency_key: { type: string, maxLength: 160 }
        correlation_id: { type: string, nullable: true, maxLength: 160 }
        responsibility_event: { $ref: '#/components/schemas/ResponsibilityEventWrite' }
    ResponsibilityEventWrite:
      type: object
      description: >-
        Optional P1.1 structured event written atomically with this canonical
        immutable workflow/system message. Recipient routing is server-owned:
        the requester receives responder updates and participants who own the
        next action are directly addressed. Client-supplied addressing is
        ignored and an empty list never falls back to broadcast. An idempotency
        key is required. The referenced source must be a same-project direct
        message, not another responsibility-event message.
        Historical direct messages without a membership-generation baseline
        require migration before they can receive responsibility events.
      required: [kind, request_message_id, initial_responder_participant_id, expected_event_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [work_started, blocked, unblocked, resolution_proposed,
            resolution_accepted, resolution_disputed, resolution_withdrawn,
            approval_approved, approval_denied, review_accepted,
            review_revision_requested,
            request_withdrawn, transfer_offered, transfer_accepted,
            transfer_declined, reopened, responder_restored, corrected]
        request_message_id: { type: integer, minimum: 1 }
        initial_responder_participant_id: { type: integer, minimum: 1 }
        expected_event_id: { type: integer, minimum: 1, description: Latest observed event message ID, or original request message ID when no event exists. }
        reference_event_id: { type: integer, minimum: 1, description: Required for an unblock, pending-offer/proposal decision, or correction. }
        target_participant_id: { type: integer, minimum: 1, description: Required only for transfer_offered. }
    TaskCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, nullable: true }
        acceptance_criteria: { type: string, nullable: true }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        assignee_participant_id: { type: integer, minimum: 1, nullable: true }
        deliverable_id: { type: integer, minimum: 1, nullable: true, description: Optional deliverable produced by this task. }
        source_message_id: { type: integer, minimum: 1, nullable: true }
        convert_action_request: { type: boolean, default: false }
        due_at: { type: string, nullable: true, description: UTC date-time accepted by the server. }
    TaskUpdate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: Latest observed optimistic-lock version. }
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, nullable: true }
        acceptance_criteria: { type: string, nullable: true }
        priority: { type: string, enum: [low, normal, high, urgent] }
        assignee_participant_id: { type: integer, minimum: 1, nullable: true }
        deliverable_id: { type: integer, minimum: 1, nullable: true, description: Optional deliverable produced by this task. }
        due_at: { type: string, nullable: true, description: UTC date-time accepted by the server. }
        status: { type: string, enum: [open, in_progress, in_review, blocked, completed, cancelled] }
        blocked_reason: { type: string, nullable: true }
        completion_summary: { type: string, nullable: true }
        note: { type: string, nullable: true }
    TaskDeliverableLinkUpdate:
      type: object
      required: [version, deliverable_id, note]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: Latest observed optimistic-lock version for the task. }
        deliverable_id: { type: integer, minimum: 1, nullable: true, description: Target deliverable, or null to unlink the task. }
        note: { type: string, minLength: 1, maxLength: 4000, description: Evidence explaining why this task belongs to or is removed from the deliverable. }
    ProjectChangeProposalCreate:
      type: object
      required: [proposal_type]
      additionalProperties: false
      description: >-
        A non-secret suggestion stored for human review. project_details requires
        at least one project field; agent_setup requires display_name;
        agent_profile_update requires target_agent_id and at least one profile field.
      properties:
        proposal_type: { type: string, enum: [project_details, agent_setup, agent_profile_update] }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 10000 }
        instructions: { type: string, maxLength: 50000 }
        target_agent_id: { type: integer, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        provider: { type: string, maxLength: 120 }
        runtime_name: { type: string, maxLength: 160 }
        role_title: { type: string, maxLength: 120 }
        role_summary: { type: string, maxLength: 4000 }
        role_instructions: { type: string, maxLength: 20000 }
        supervising_participant_id: { type: integer, minimum: 1, nullable: true }
        rationale: { type: string, maxLength: 4000 }
    AgentActivationBinding:
      type: object
      required: [project_id, agent_id, enabled]
      properties:
        project_id: { type: integer, minimum: 1 }
        agent_id: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        provider: { type: string, enum: [codex, chatgpt] }
        activation_driver: { type: string, enum: [connector, browser_companion] }
        discussion_reference: { type: string, description: "Provider-facing reference normalized by Syndicatum; use codex://threads/{thread_id} or https://chatgpt.com/c/{discussion_id}." }
        conversation_id: { type: string, maxLength: 255, readOnly: true, description: Canonical normalized discussion ID. }
        working_directory: { type: string, maxLength: 1024 }
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated caller lacks permission or a human mutation lacks valid CSRF evidence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: The requested state change conflicts with the current project or message state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource unavailable; project isolation does not reveal foreign resources
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
