name: V1 contract candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, gd, mbstring, pdo_mysql
          coverage: none
        env:
          fail-fast: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenAPI validator dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Check PHP syntax
        run: |
          php -l mcp.php
          php -l src/McpServiceTokenService.php
          php -l tests/project-api.php
          php -l tests/ci-database-mode.php
      - name: Identify tested revision and database mode
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          printf 'repository=%s\ncommit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > ci-evidence/revision.txt
          php tests/ci-database-mode.php | tee ci-evidence/database-mode.txt
      - name: Check migrations and server-side coordination contract
        run: |
          set -euo pipefail
          php tests/migrations.php | tee ci-evidence/migrations.txt
          php tests/agent-activation.php | tee ci-evidence/agent-activation.txt
          php tests/chatgpt-oauth.php | tee ci-evidence/chatgpt-oauth.txt
          python tests/openapi-message-contract.py --php php | tee ci-evidence/openapi-message-contract.txt
      - name: Check portable Codex and Companion adapter contracts
        run: |
          set -euo pipefail
          node --test plugins/codex/test/profile-timeline.test.mjs plugins/codex/test/syndicatum-client.test.mjs | tee ci-evidence/codex-portable.txt
          node --test companion/test/package.test.mjs | tee ci-evidence/companion-portable.txt
      - name: Retain source-contract test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 30

  docker-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Package exact commit and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate/unpacked
          archive="syndicatum-${GITHUB_SHA}.tar.gz"
          git archive --format=tar --prefix=syndicatum/ "$GITHUB_SHA" | gzip -n > "release-candidate/$archive"
          (cd release-candidate && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
          tar -xzf "release-candidate/$archive" -C release-candidate/unpacked
          test -f release-candidate/unpacked/syndicatum/compose.yaml
          test -f release-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1
      - name: Identify Docker acceptance environment
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          pwsh --version
      - name: Run isolated MySQL 5.7.44 archived-candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./release-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1 2>&1 | tee docker-acceptance.log
      - name: Retain Docker source-tree acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-source-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            docker-acceptance.log
            release-candidate/*.tar.gz
            release-candidate/*.sha256
          if-no-files-found: warn
          retention-days: 30
