name: V1 contract candidate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  external-host-preflight-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate external-host preflight contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/external-host-preflight.sh
          bash scripts/external-host-preflight.sh --self-test | tee external-host-preflight-self-test.txt
          shellcheck scripts/external-host-preflight.sh
      - name: Retain preflight contract evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: external-host-preflight-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: external-host-preflight-self-test.txt
          if-no-files-found: warn
          retention-days: 30

  security-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare private scanner output directory
        run: mkdir -p ci-security
      - name: Scan source dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: ci-security/trivy.json
          exit-code: '0'
      - name: Retain safe finding summary and reject detected secrets
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-security/trivy.json
          secret_count="$(jq '[.Results[]? | .Secrets[]?] | length' ci-security/trivy.json)"
          vulnerability_count="$(jq '[.Results[]? | .Vulnerabilities[]?] | length' ci-security/trivy.json)"
          misconfiguration_count="$(jq '[.Results[]? | .Misconfigurations[]?] | length' ci-security/trivy.json)"
          printf 'commit=%s\nsecret_findings=%s\nvulnerability_findings=%s\nmisconfiguration_findings=%s\n' \
            "$GITHUB_SHA" "$secret_count" "$vulnerability_count" "$misconfiguration_count" \
            | tee ci-security/summary.txt
          jq -r '.Results[]? as $result | $result.Misconfigurations[]? |
            ["configuration", $result.Target, .ID, .Severity] | @tsv' \
            ci-security/trivy.json | sort -u | tee -a ci-security/summary.txt
          jq -r '.Results[]? as $result | $result.Vulnerabilities[]? |
            ["dependency", $result.Target, .PkgName, .VulnerabilityID, .Severity] | @tsv' \
            ci-security/trivy.json | sort -u | tee -a ci-security/summary.txt
          if [ "$secret_count" -ne 0 ]; then
            echo 'Secret findings require private triage and credential rotation where applicable.' >&2
            exit 1
          fi
      - name: Retain revision-bound summary without raw secret findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-security/summary.txt
          if-no-files-found: warn
          retention-days: 30

  package-contract-portability:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
        env:
          fail-fast: true
      - name: Verify package and archive reader contracts on Windows and PHP 7.4
        shell: pwsh
        run: |
          php tests/package-contract.php
          php tests/backup-envelope.php
          php tests/archive-safety.php

  canonical-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none
        env:
          fail-fast: true
      - name: Verify the closed producer policy and deterministic candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/canonical-release-producer.py
          mkdir -p canonical-candidate/first canonical-candidate/second
          tag="candidate-${GITHUB_SHA}"
          python3 tools/release/canonical_release.py \
            --repository . --commit "$GITHUB_SHA" --tag "$tag" \
            --output-dir canonical-candidate/first \
            | tee canonical-candidate/first/build-result.json
          python3 tools/release/canonical_release.py \
            --repository . --commit "$GITHUB_SHA" --tag "$tag" \
            --output-dir canonical-candidate/second \
            | tee canonical-candidate/second/build-result.json
          for name in syndicatum-v1.0.0.zip syndicatum-v1.0.0.manifest.json syndicatum-v1.0.0.sha256 syndicatum-v1.0.0.provenance.json; do
            cmp "canonical-candidate/first/$name" "canonical-candidate/second/$name"
          done
          (cd canonical-candidate/first && sha256sum --check syndicatum-v1.0.0.sha256)
      - name: Round-trip exact candidate through the frozen reader and controlled extractor
        shell: bash
        run: |
          set -euo pipefail
          staging_root="$(mktemp -d)"
          public_root="$(mktemp -d)"
          chmod 0700 "$staging_root" "$public_root"
          php tests/canonical-release-roundtrip.php \
            canonical-candidate/first/syndicatum-v1.0.0.zip \
            canonical-candidate/first/syndicatum-v1.0.0.manifest.json \
            "$staging_root" "$public_root" \
            "$GITHUB_SHA" "candidate-${GITHUB_SHA}" \
            syndicatum-mysql84-1.0.0-baseline.1 202609180004 \
            | tee canonical-candidate/first/roundtrip.json
      - name: Clean-install the exact candidate artifact on empty MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(jq -r '.stage' canonical-candidate/first/roundtrip.json)"
          test -d "$package_root/app"
          install_root="$(mktemp -d)"
          cp -a "$package_root/app/." "$install_root/"
          mkdir -p "$install_root/schema"
          cp -a "$package_root/schema/baselines/mysql84" "$install_root/schema/mysql84"
          cp -a "$package_root/plugins" "$install_root/plugins"
          cp -a "$package_root/skills" "$install_root/skills"
          package_sha="$(cut -d ' ' -f 1 canonical-candidate/first/syndicatum-v1.0.0.sha256)"
          export SYNDICATUM_ACCEPTANCE_INGRESS_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/realtime-acceptance-ingress.php"
          pwsh -NoProfile -File scripts/docker-acceptance.ps1 \
            -ComposeFile "$install_root/compose.yaml" \
            -PackageSha256 "$package_sha" \
            -ReleaseSourceCommit "$GITHUB_SHA" \
            2>&1 | tee canonical-candidate/first/mysql84-install.log
      - name: Retain non-authoritative candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: canonical-candidate/first/
          if-no-files-found: error
          retention-days: 30

  mysql84-baseline-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: syndicatum_baseline_drift
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PBB_AGENTCHAT_DB_HOST: 127.0.0.1
      PBB_AGENTCHAT_DB_NAME: syndicatum_baseline_drift
      PBB_AGENTCHAT_DB_USER: root
      PBB_AGENTCHAT_DB_PASS: ""
      PBB_AGENTCHAT_SECRET: baseline-drift-only-secret-at-least-32-characters
      SYNDICATUM_MASTER_KEY: baseline-drift-only-master-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none
        env:
          fail-fast: true
      - name: Regenerate the frozen baseline and reject drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-baseline
          php scripts/hidden-replay-audit.php | tee ci-baseline/hidden-replay-audit.txt
          bash scripts/check-baseline-drift.sh | tee ci-baseline/drift-check.txt
      - name: Retain deterministic baseline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql84-baseline-drift-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-baseline/
          if-no-files-found: warn
          retention-days: 30

  mysql84-encrypted-backup-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PBB_AGENTCHAT_DB_HOST: 127.0.0.1
      PBB_AGENTCHAT_DB_PORT: "3306"
      PBB_AGENTCHAT_DB_USER: root
      PBB_AGENTCHAT_DB_PASS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, zip
          coverage: none
        env:
          fail-fast: true
      - name: Round-trip encrypted durable state through clean MySQL 8.4 target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-backup
          php tests/backup-mysql84-roundtrip.php | tee ci-backup/mysql84-roundtrip.json
      - name: Retain encrypted backup round-trip evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql84-encrypted-backup-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-backup/
          if-no-files-found: error
          retention-days: 30

  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, gd, mbstring, pdo_mysql
          coverage: none
        env:
          fail-fast: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install OpenAPI validator dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Check tracked PHP and JavaScript syntax
        run: |
          set -euo pipefail
          php_count=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            php_count=$((php_count + 1))
          done < <(git ls-files -z -- '*.php')
          js_count=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            js_count=$((js_count + 1))
          done < <(git ls-files -z -- '*.js' '*.mjs')
          printf 'Syntax passed: %s PHP files and %s JavaScript files.\n' "$php_count" "$js_count"
      - name: Identify tested revision and database mode
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          printf 'repository=%s\ncommit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > ci-evidence/revision.txt
          php tests/ci-database-mode.php | tee ci-evidence/database-mode.txt
      - name: Check migrations and server-side coordination contract
        run: |
          set -euo pipefail
          php tests/migrations.php | tee ci-evidence/migrations.txt
          php tests/expansion.php | tee ci-evidence/expansion.txt
          php tests/responsibility-reducer.php | tee ci-evidence/responsibility-reducer.txt
          php tests/responsibility-events.php | tee ci-evidence/responsibility-events.txt
          node --test tests/responsibility-client.mjs | tee ci-evidence/responsibility-client.txt
          php tests/project-api.php | tee ci-evidence/project-api.txt
          php tests/agent-activation.php | tee ci-evidence/agent-activation.txt
          php tests/chatgpt-oauth.php | tee ci-evidence/chatgpt-oauth.txt
          php tests/mcp-connection-health.php | tee ci-evidence/mcp-connection-health.txt
          php tests/operational-health.php | tee ci-evidence/operational-health.txt
          php tests/package-contract.php | tee ci-evidence/package-contract.txt
          php tests/backup-envelope.php | tee ci-evidence/backup-envelope.txt
          php tests/backup-producer.php | tee ci-evidence/backup-producer.txt
          php tests/recovery-operation-store.php | tee ci-evidence/recovery-operation-store.txt
          python tests/canonical-inventory-contract.py | tee ci-evidence/canonical-inventory-contract.txt
          php tests/archive-safety.php | tee ci-evidence/archive-safety.txt
          php tests/message-delivery-status.php | tee ci-evidence/message-delivery-status.txt
          php tests/delivery-failure-taxonomy.php | tee ci-evidence/delivery-failure-taxonomy.txt
          php tests/delivery-operator-view.php | tee ci-evidence/delivery-operator-view.txt
          php tests/realtime.php | tee ci-evidence/realtime-delivery.txt
          php tests/avatar-webhooks.php | tee ci-evidence/agent-webhooks.txt
          php tests/workspace-agent-triggers.php | tee ci-evidence/workspace-agent-triggers.txt
          php tests/responses-api-activation.php | tee ci-evidence/responses-api-activation.txt
          php tests/outbox-retry-contract.php | tee ci-evidence/outbox-retry-contract.txt
          php tests/project-api.php | tee ci-evidence/project-api.txt
          python tests/openapi-message-contract.py --php php | tee ci-evidence/openapi-message-contract.txt
      - name: Check portable Codex and Companion adapter contracts
        run: |
          set -euo pipefail
          node --test plugins/codex/test/profile-timeline.test.mjs plugins/codex/test/syndicatum-client.test.mjs | tee ci-evidence/codex-portable.txt
          node --test companion/test/*.test.mjs | tee ci-evidence/companion-portable.txt
      - name: Retain source-contract test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 30

  docker-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Package exact commit and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate/unpacked
          archive="syndicatum-${GITHUB_SHA}.tar.gz"
          git archive --format=tar --prefix=syndicatum/ "$GITHUB_SHA" | gzip -n > "release-candidate/$archive"
          (cd release-candidate && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
          tar -xzf "release-candidate/$archive" -C release-candidate/unpacked
          test -f release-candidate/unpacked/syndicatum/compose.yaml
          test -f release-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1
      - name: Identify Docker acceptance environment
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          pwsh --version
      - name: Run isolated baseline-only MySQL 8.4 archived-candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export SYNDICATUM_PACKAGE_SHA256="$(awk '{print $1}' "release-candidate/syndicatum-${GITHUB_SHA}.tar.gz.sha256")"
          export SYNDICATUM_RELEASE_SOURCE_COMMIT="$GITHUB_SHA"
          pwsh -NoProfile -File ./release-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1 2>&1 | tee docker-acceptance.log
      - name: Identify the exact acceptance images
        id: acceptance-images
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t app_images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E '^syndicatum-acceptance-[a-f0-9]{12}-app:acceptance$' || true)
          mapfile -t db_images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E '^syndicatum-acceptance-[a-f0-9]{12}-db:acceptance$' || true)
          test "${#app_images[@]}" -eq 1
          test "${#db_images[@]}" -eq 1
          printf 'app=%s\ndb=%s\n' "${app_images[0]}" "${db_images[0]}" >> "$GITHUB_OUTPUT"
      - name: Inventory built application image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acceptance-images.outputs.app }}
          scanners: vuln
          format: json
          output: application-image-scan.json
          exit-code: '0'
      - name: Inventory built database image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acceptance-images.outputs.db }}
          scanners: vuln
          format: json
          output: database-image-scan.json
          exit-code: '0'
      - name: Retain image vulnerability inventory without raw reports
        shell: bash
        run: |
          set -euo pipefail
          : > image-security-findings.tsv
          for component in application database; do
            report="${component}-image-scan.json"
            test -s "$report"
            result_count="$(jq '.Results | length' "$report")"
            test "$result_count" -gt 0
            critical="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")"
            high="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")"
            medium="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' "$report")"
            printf '%s_image_results=%s\n%s_critical=%s\n%s_high=%s\n%s_medium=%s\n' \
              "$component" "$result_count" "$component" "$critical" "$component" "$high" "$component" "$medium" \
              | tee -a image-security-summary.txt
            jq -r --arg component "$component" '.Results[]? as $result | $result.Vulnerabilities[]? |
              [$component, $result.Target, $result.Type, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID, .Severity] | @tsv' \
              "$report" >> image-security-findings.tsv
          done
          sort -u image-security-findings.tsv -o image-security-findings.tsv
      - name: Retain Docker source-tree acceptance log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-source-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            docker-acceptance.log
            image-security-summary.txt
            image-security-findings.tsv
            release-candidate/*.tar.gz
            release-candidate/*.sha256
          if-no-files-found: warn
          retention-days: 30

  mysql84-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Package exact commit and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mysql84-candidate/unpacked
          archive="syndicatum-${GITHUB_SHA}.tar.gz"
          git archive --format=tar --prefix=syndicatum/ "$GITHUB_SHA" | gzip -n > "mysql84-candidate/$archive"
          (cd mysql84-candidate && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
          tar -xzf "mysql84-candidate/$archive" -C mysql84-candidate/unpacked
          test -f mysql84-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1
      - name: Identify MySQL 8.4 compatibility environment
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          pwsh --version
      - name: Run isolated MySQL 8.4.11 archived-candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export SYNDICATUM_PACKAGE_SHA256="$(awk '{print $1}' "mysql84-candidate/syndicatum-${GITHUB_SHA}.tar.gz.sha256")"
          export SYNDICATUM_RELEASE_SOURCE_COMMIT="$GITHUB_SHA"
          pwsh -NoProfile -File ./mysql84-candidate/unpacked/syndicatum/scripts/docker-acceptance.ps1 \
            -MySqlImage 'mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a' \
            -ExpectedMySqlVersionPattern '^8\.4(?:$|[.-])' \
            -DatabaseSqlMode 'STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION' \
            2>&1 | tee mysql84-acceptance.log
      - name: Identify the exact MySQL 8.4 acceptance image
        id: mysql84-image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E '^syndicatum-acceptance-[a-f0-9]{12}-db:acceptance$' || true)
          test "${#db_images[@]}" -eq 1
          printf 'db=%s\n' "${db_images[0]}" >> "$GITHUB_OUTPUT"
          docker image inspect "${db_images[0]}" \
            --format 'image_id={{.Id}} architecture={{.Architecture}} os={{.Os}}' \
            | tee mysql84-image-identity.txt
      - name: Inventory the built MySQL 8.4 image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.mysql84-image.outputs.db }}
          scanners: vuln
          format: json
          output: mysql84-image-scan.json
          exit-code: '0'
      - name: Retain the MySQL 8.4 vulnerability inventory without raw reports
        shell: bash
        run: |
          set -euo pipefail
          test -s mysql84-image-scan.json
          result_count="$(jq '.Results | length' mysql84-image-scan.json)"
          test "$result_count" -gt 0
          critical="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' mysql84-image-scan.json)"
          high="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' mysql84-image-scan.json)"
          medium="$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' mysql84-image-scan.json)"
          printf 'mysql84_image_results=%s\nmysql84_critical=%s\nmysql84_high=%s\nmysql84_medium=%s\n' \
            "$result_count" "$critical" "$high" "$medium" \
            | tee mysql84-image-security-summary.txt
          jq -r '.Results[]? as $result | $result.Vulnerabilities[]? |
            ["database-mysql84", $result.Target, $result.Type, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID, .Severity] | @tsv' \
            mysql84-image-scan.json | sort -u > mysql84-image-security-findings.tsv
      - name: Retain MySQL 8.4 compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql84-compatibility-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mysql84-acceptance.log
            mysql84-image-identity.txt
            mysql84-image-security-summary.txt
            mysql84-image-security-findings.tsv
            mysql84-candidate/*.tar.gz
            mysql84-candidate/*.sha256
          if-no-files-found: warn
          retention-days: 30

  mysql57-to-84-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Package exact commit and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mysql-migration-candidate/unpacked
          archive="syndicatum-${GITHUB_SHA}.tar.gz"
          git archive --format=tar --prefix=syndicatum/ "$GITHUB_SHA" | gzip -n > "mysql-migration-candidate/$archive"
          (cd mysql-migration-candidate && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
          tar -xzf "mysql-migration-candidate/$archive" -C mysql-migration-candidate/unpacked
          test -f mysql-migration-candidate/unpacked/syndicatum/scripts/mysql57-to-84-migration-acceptance.ps1
      - name: Run isolated MySQL 5.7 to 8.4 migration lifecycle
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./mysql-migration-candidate/unpacked/syndicatum/scripts/mysql57-to-84-migration-acceptance.ps1 \
            2>&1 | tee mysql57-to-84-migration.log
      - name: Retain MySQL migration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql57-to-84-migration-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mysql57-to-84-migration.log
            mysql-migration-candidate/*.tar.gz
            mysql-migration-candidate/*.sha256
          if-no-files-found: warn
          retention-days: 30
