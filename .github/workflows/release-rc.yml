name: V1 release candidate

on:
  push:
    tags:
      - 'v1.0.0-rc.*'

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require an immutable-style annotated RC tag on protected main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v1\.0\.0-rc\.[1-9][0-9]*$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -s "docs/releases/$tag.md"
          printf 'Verified tag %s at %s on main with release notes.\n' "$tag" "$GITHUB_SHA"

  contract-and-docker:
    needs: verify-tag
    uses: ./.github/workflows/contract-ci.yml
    permissions:
      contents: read

  canonical-producer:
    needs: [verify-tag, contract-and-docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none
        env:
          fail-fast: true
      - name: Fetch protected main and build twice from immutable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          output_root="$RUNNER_TEMP/canonical-release"
          build_log="$RUNNER_TEMP/canonical-build.log"
          bash scripts/build-canonical-release.sh "$output_root" | tee "$build_log"
          mkdir -p canonical-release
          cp "$output_root/first/"* canonical-release/
          cp "$build_log" canonical-build.log
      - name: Round-trip and clean-install the exact canonical ZIP on MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          staging_root="$(mktemp -d)"
          public_root="$(mktemp -d)"
          chmod 0700 "$staging_root" "$public_root"
          php tests/canonical-release-roundtrip.php \
            canonical-release/syndicatum-v1.0.0.zip \
            canonical-release/syndicatum-v1.0.0.manifest.json \
            "$staging_root" "$public_root" \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            syndicatum-mysql84-1.0.0-baseline.1 202609180004 \
            | tee canonical-release/roundtrip.json
          package_root="$(jq -r '.stage' canonical-release/roundtrip.json)"
          install_root="$(mktemp -d)"
          cp -a "$package_root/app/." "$install_root/"
          mkdir -p "$install_root/schema"
          cp -a "$package_root/schema/baselines/mysql84" "$install_root/schema/mysql84"
          cp -a "$package_root/plugins" "$install_root/plugins"
          cp -a "$package_root/skills" "$install_root/skills"
          package_sha="$(cut -d ' ' -f 1 canonical-release/syndicatum-v1.0.0.sha256)"
          export SYNDICATUM_ACCEPTANCE_INGRESS_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/realtime-acceptance-ingress.php"
          pwsh -NoProfile -File scripts/docker-acceptance.ps1 \
            -ComposeFile "$install_root/compose.yaml" \
            -PackageSha256 "$package_sha" \
            -ReleaseSourceCommit "$GITHUB_SHA" \
            2>&1 | tee canonical-release/mysql84-install.log
      - name: Retain the sole canonical producer output
        uses: actions/upload-artifact@v6
        with:
          name: canonical-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            canonical-release/
            canonical-build.log
          if-no-files-found: error
          retention-days: 90

  publish-rc:
    needs: [verify-tag, contract-and-docker, canonical-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: canonical-release-${{ github.sha }}-${{ github.run_attempt }}
          path: downloaded-canonical
      - name: Verify the exact canonical artifact set
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          root="$(dirname "$(find downloaded-canonical -type f -name syndicatum-v1.0.0.zip -print -quit)")"
          test -n "$root"
          for name in syndicatum-v1.0.0.zip syndicatum-v1.0.0.manifest.json syndicatum-v1.0.0.sha256 syndicatum-v1.0.0.provenance.json; do
            test -s "$root/$name"
          done
          (cd "$root" && sha256sum --check syndicatum-v1.0.0.sha256)
          test "$(jq -r '.source_commit' "$root/syndicatum-v1.0.0.manifest.json")" = "$GITHUB_SHA"
          test "$(jq -r '.source_tag' "$root/syndicatum-v1.0.0.manifest.json")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.canonical' "$root/syndicatum-v1.0.0.provenance.json")" = true
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Publish new prerelease without replacing an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.artifact.outputs.root }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ROOT/syndicatum-v1.0.0.zip" \
            "$ROOT/syndicatum-v1.0.0.manifest.json" \
            "$ROOT/syndicatum-v1.0.0.sha256" \
            "$ROOT/syndicatum-v1.0.0.provenance.json" \
            --verify-tag --prerelease --title "Syndicatum $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Verify published files and release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$GITHUB_REF_NAME" --dir published
          (cd published && sha256sum --check syndicatum-v1.0.0.sha256)
          test "$(jq -r '.source_commit' published/syndicatum-v1.0.0.manifest.json)" = "$GITHUB_SHA"
          test "$(jq -r '.source_tag' published/syndicatum-v1.0.0.manifest.json)" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json tagName --jq '.tagName')" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = true
      - name: Retain published-artifact installation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: published-rc-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            published/
          if-no-files-found: warn
          retention-days: 30
